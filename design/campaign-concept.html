<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#183438"><title>等等贝贝吧 · 银杏魔法学院</title><link rel="stylesheet" href="campaign-concept.css"></head>
<body>
<main>
  <section id="home" class="home" aria-label="游戏首页">
    <button class="corner-button settings-button" aria-label="设置">⚙</button>
    <div class="game-logo"><div class="crest" aria-hidden="true">✦</div><p>银杏魔法学院</p><h1>等等<br><span>贝贝吧</span></h1><div class="logo-ribbon">一场没说完的冒险</div></div>
    <div class="home-actions"><button id="start" class="wood-button">开始旅程</button><button id="journal-home" class="wood-button secondary">漫画手记</button></div>
    <span class="preview-badge">设计样稿</span>
  </section>
  <section id="campaign" class="campaign" hidden aria-label="旅程地图">
    <header class="map-hud"><button id="back-home" class="corner-button" aria-label="返回首页">‹</button><div class="star-counter" aria-label="演示二颗星"><span>★</span>2</div><h1 class="chapter-plaque">银杏魔法学院</h1><button class="corner-button settings-button" aria-label="设置">⚙</button></header>
    <div id="map-viewport" class="map-viewport" tabindex="0" aria-label="世界地图，手机左右滑动探索；Tab 选择关卡旗帜"><div id="map-world" class="map-world">
      <img class="map-art" src="assets/campaign-map-v2.webp" width="1672" height="941" alt="学院、旧街、集市、图书馆、湖畔与观星台相连的原创魔法地图" draggable="false">
      <svg class="routes" viewBox="0 0 1000 570" preserveAspectRatio="none" aria-hidden="true"><path d="M180 382 Q245 333 360 302 Q440 250 550 194 Q440 85 210 148 M550 194 Q680 135 790 171 Q860 300 780 410"/></svg><div id="map-nodes"></div>
    </div></div>
    <nav class="map-dock" aria-label="地图菜单"><button id="locate"><span aria-hidden="true">⚑</span>地图</button><button id="journal"><span aria-hidden="true">▤</span>漫画</button><button id="characters"><span aria-hidden="true">♙</span>人物</button><button id="practice"><span aria-hidden="true">✧</span>练习</button></nav>
    <span class="preview-badge">设计样稿</span>
  </section>
</main>
<dialog id="level-dialog" class="level-dialog" aria-labelledby="level-title"><h2 id="level-title" class="modal-plaque"></h2><button id="close-level" class="close-button" aria-label="关闭关卡介绍">×</button><div id="level-content"></div></dialog>
<dialog id="info-dialog" class="info-dialog" aria-labelledby="info-title"><h2 id="info-title" class="modal-plaque"></h2><button id="close-info" class="close-button" aria-label="关闭">×</button><div id="info-content"></div></dialog>
<dialog id="comic-dialog" class="comic-dialog" aria-labelledby="comic-title"><h2 id="comic-title" class="sr-only">第三关 · 纸巾救援漫画样稿</h2><button id="close-comic" class="comic-close" aria-label="关闭漫画">×</button><div id="comic-page" class="comic-page" aria-live="polite"></div><button id="comic-reveal" class="comic-continue">点击显示全部</button></dialog>
<script type="module" src="campaign-concept.js"></script>
</body>
</html>

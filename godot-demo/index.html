function levelMarker(level,stars,locked){
 const id='banner-'+level,light=locked?'#7d9194':stars?'#e9c168':'#32bfd0',dark=locked?'#405862':stars?'#995321':'#12677d';
 const symbol=locked?'<path d="M42 54V49a7 7 0 0 1 14 0v5" fill="none" stroke="#e7e5d2" stroke-width="3"/><rect x="39" y="54" width="20" height="17" rx="3" fill="#e7e5d2"/><circle cx="49" cy="60" r="2" fill="#385565"/>':'<text x="49" y="69" text-anchor="middle" font-size="30" font-weight="900" fill="#fff5d3" stroke="#273f50" stroke-width=".6" paint-order="stroke">'+level+'</text>';
 return '<svg viewBox="0 0 88 112" aria-hidden="true"><defs><linearGradient id="'+id+'" x2="1" y2="1"><stop stop-color="'+light+'"/><stop offset="1" stop-color="'+dark+'"/></linearGradient></defs><ellipse cx="42" cy="107" rx="24" ry="4" fill="#092d3b" opacity=".45"/><path d="M18 18V107" stroke="#453424" stroke-width="6"/><path d="M17 18V105" stroke="#e1b565" stroke-width="2"/><path d="M18 9l6 8-6 8-6-8z" fill="#ffe6a2" stroke="#745334" stroke-width="2"/><path d="M21 28Q47 22 77 28V77Q65 95 49 96Q33 93 21 84Z" fill="url(#'+id+')" stroke="#ffe3a0" stroke-width="3"/><path d="M27 32Q48 28 70 32V75Q59 88 49 90Q35 87 27 81Z" fill="none" stroke="#fff4c5" stroke-width="1" opacity=".7"/><path d="M21 30l6 52-6 2z" fill="#0b3548" opacity=".3"/><path d="M15 27H80" stroke="#70502d" stroke-width="7" stroke-linecap="round"/><path d="M15 25H80" stroke="#f4d48f" stroke-width="3" stroke-linecap="round"/><path d="M45 35l4-4 4 4-4 4z" fill="#ffebbc"/>'+symbol+'<path d="M35 78q14 8 28-1" fill="none" stroke="#f6d790" stroke-width="1.5"/></svg>';

 else if(s.mode==='map'){

 html='<section class="scene-view map-view"><div class="map-plane"><svg class="map-path" viewBox="0 0 1000 562"><path d="M180 388 Q210 322 360 309 Q410 245 550 202" fill="none" stroke="#283b41" stroke-width="5" stroke-dasharray="1 12" stroke-linecap="round"/><path d="M180 388 Q210 322 360 309 Q410 245 550 202" fill="none" stroke="#ffe6a2" stroke-width="3" stroke-dasharray="1 12" stroke-linecap="round"/><path d="M550 202 Q555 120 230 152 M550 202 Q640 141 800 180 Q870 273 790 410" fill="none" stroke="#d8e6dc" stroke-width="3" stroke-dasharray="1 12" stroke-linecap="round" opacity=".6"/></svg>'+pins+'</div>'+menuHead()+'<nav class="map-dock"><button data-action="map"><span>⚑</span>地图</button><button data-action="replay"><span>▤</span>漫画</button><button data-action="sample"><span>✧</span>练习</button></nav></section>';
 }else if(s.mode==='archive'){const labels={intro:'出发之前',outro:'伙伴与约定',bridge:'定位铃',mid:'服务站',return:'回头的理由'};html='<section class="modal-shade"><article class="level-brief"><h2 class="brief-heading">学院漫画册</h2><button class="icon-button close-modal" data-action="map" aria-label="关闭">×</button><div class="archive-list">'+s.titles.map((title,i)=>'<section><h3>'+escapeText(title)+'</h3>'+s.scenes.filter(key=>key.startsWith((i+1)+'_')).map(key=>'<button data-action="replay:'+key+'">'+labels[key.split('_')[1]]+'</button>').join('')+'</section>').join('')+'</div></article></section>'}
 else if(s.mode==='brief')html='<section class="modal-shade"><article class="level-brief"><h2 class="brief-heading">'+s.chapter+' · '+escapeText(s.titles[s.chapter-1])+'</h2><button class="icon-button close-modal" data-action="map" aria-label="关闭">×</button><div class="brief-columns"><img class="brief-road" src="ui/'+roadNames[s.chapter-1]+'" alt="本关道路场景"><div class="brief-copy"><p>'+escapeText(s.brief)+'</p><button class="wood-button" data-action="start:'+s.chapter+'">出发</button></div></div></article></section>';
 else if(s.mode==='comic')html='<section class="comic-page"><h2 class="comic-head">'+escapeText(s.titles[s.chapter-1])+'</h2><div class="comic-panels">'+renderPanels(s)+'</div><footer class="comic-footer"><button data-action="skip">跳过</button><button data-action="comic">'+(s.shown<s.panels.length?'展开全页':'继续')+'</button></footer></section>';
 else if(['pause','failed','completed'].includes(s.mode))html='<section class="modal-shade"><article class="pause-card"><h2>'+(s.mode==='pause'?'稍作休息':s.mode==='failed'?'再试一次':'伙伴，一个也不少')+'</h2><p>'+(s.mode==='failed'?(s.phase==='failed'&&s.time===0?'通行窗口结束了。返程检查点重试，纸巾仍在。':'从最近的安全路段继续，生命恢复为三颗。'):s.mode==='completed'?'★'.repeat(s.stars[s.chapter-1])+' · '+s.coins+' 枚硬币':'休息时，世界也会等你。')+'</p><button class="wood-button" data-action="'+(s.mode==='pause'?'pause':'restart')+'">'+(s.mode==='pause'?'继续':s.mode==='failed'?'检查点重试':'再跑一次')+'</button><button data-action="map">学院地图</button><button data-action="settings">设置</button></article></section>';
 ui.innerHTML=html;
 ui.scrollTop=savedScroll;
 if(ui.querySelector('.comic-panels'))ui.querySelector('.comic-panels').scrollTop=panelScroll;
 document.querySelector('.settings-popup')?.remove();
 if(settingsOpen){const overlay=document.createElement('div');overlay.className='settings-popup';overlay.innerHTML='<article class="pause-card"><h2>选项</h2><button data-action="sound">音效 · '+(s.sound?'开启':'关闭')+'</button><button data-action="fps:60">节能 · 60 帧上限</button><button data-action="fps:120">流畅 · 120 帧上限</button><p>物理始终独立运行；实际帧率取决于设备。<br>空格跳 · 左回头 · 长按前进方向加速<br>下＋跳穿台 · P 暂停</p><button class="wood-button" data-action="close-settings">返回</button></article>';document.body.append(overlay)}
}
window.renderCampaign=s=>{
 const previous=currentState?.mode;currentState=s;
 if(new URLSearchParams(location.search).has('debug'))window.campaignState=s;
 const open=s.mode!=='play';ui.hidden=!open;hud.hidden=false;
 document.body.classList.toggle('ui-open',open);
 document.querySelector('#hud-title').textContent=s.titles[s.chapter-1]+' '+Math.round((s.progress||0)*100)+'%';
 document.querySelector('#hearts').textContent='♥'.repeat(s.hearts)+'♡'.repeat(3-s.hearts);
 document.querySelector('#energy-fill').style.width=(s.energy||0)+'%';
 document.querySelector('#return-clock').textContent=s.phase==='return'?'返程 '+Math.ceil(s.time)+'s':'● '+s.coins;
 if(previous!==s.mode){releaseAll();if(s.mode==='play')canvas.focus();else for(const tone of activeTones)try{tone.stop()}catch{}}
 const next=[s.mode,s.chapter,s.shown,s.sound,s.fps,s.stars.join(',')].join('|');
 if(next!==signature){signature=next;drawUI(s)}
 if(s.save_failed&&!document.querySelector('.save-notice')){const notice=document.createElement('p');notice.className='save-notice';notice.textContent='本次记录未能保存，仍可继续游玩。';document.body.append(notice)}
};
function unlockSound(){try{audio||=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume()}catch{}}
window.campaignSound=key=>{
 if(!audio||audio.state!=='running'||currentState?.sound===false)return;
 const notes={jump:[520,760,.12],coin:[960,1350,.08],hurt:[160,75,.2],kick:[260,110,.12],bell:[660,880,.6]}[key]||[400,400,.1];
 const tone=audio.createOscillator(),gain=audio.createGain(),now=audio.currentTime;
 tone.type=key==='hurt'?'triangle':'sine';tone.frequency.setValueAtTime(notes[0],now);tone.frequency.exponentialRampToValueAtTime(notes[1],now+notes[2]);gain.gain.setValueAtTime(.07,now);gain.gain.exponentialRampToValueAtTime(.0001,now+notes[2]);tone.connect(gain).connect(audio.destination);activeTones.add(tone);tone.start(now);tone.stop(now+notes[2]);tone.onended=()=>{activeTones.delete(tone);tone.disconnect();gain.disconnect()};
};
document.addEventListener('click',event=>{
 const button=event.target.closest('[data-action]');
 if(button){event.stopPropagation();unlockSound();releaseAll();const action=button.dataset.action;
  if(action==='settings'){settingsPausedPlay=currentState.mode==='play';if(settingsPausedPlay)control('suspend',true);settingsOpen=true;drawUI(currentState)}
  else if(action==='close-settings'){settingsOpen=false;drawUI(currentState);if(settingsPausedPlay)control('pause',true)}
  else if(action==='sample')location.href='?sample&debug';
  else if(action==='replay')control('archive',true);
  else if(action==='future'){button.blur()}
  else control(action,true);
 }else if(event.target.closest('.comic-page'))control('comic',true);
});
document.addEventListener('keydown',unlockSound,{once:true});
for(const button of document.querySelectorAll('[data-control]')){
 button.disabled=true;
 button.addEventListener('pointerdown',event=>{event.preventDefault();button.setPointerCapture(event.pointerId);const action=button.dataset.control;held.set(event.pointerId,action);control(action,true)});
 for(const eventName of ['pointerup','pointercancel','lostpointercapture'])button.addEventListener(eventName,event=>{const action=held.get(event.pointerId);held.delete(event.pointerId);if(action&&!Array.from(held.values()).includes(action))control(action,false)});
}
document.querySelector('#pause').onclick=()=>{releaseAll();control('pause',true);canvas.focus()};
document.querySelector('#restart').onclick=()=>{releaseAll();control('restart',true);canvas.focus()};
window.addEventListener('blur',releaseAll);
document.addEventListener('visibilitychange',()=>{if(document.hidden){releaseAll();control('suspend',true)}});
document.querySelector('#retry').onclick=()=>location.reload();
const missing=Engine.getMissingFeatures({threads:false});
async function start(){
 try{
  if(missing.length)throw new Error('浏览器需要支持 WebGL 2 / WebAssembly，请使用新版浏览器。');
  await engine.startGame({canvas,onProgress:(current,total)=>{if(total){progress.value=current;progress.max=total}}});
  status.hidden=true;status.style.display='none';
  for(const b of document.querySelectorAll('button'))b.disabled=false;
  canvas.focus();
 }catch(error){notice.textContent='加载失败：'+error.message;progress.hidden=true;document.querySelector('#retry').hidden=false;console.error(error)}
}
start();
</script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7c76b" />
    <title>等等贝贝吧</title>
    <link rel="stylesheet" href="style.css?v=20260915r4" />
  </head>
  <body>
    <main class="game-shell">
      <section id="home-screen" class="screen home-screen" aria-labelledby="game-title">
        <p class="eyebrow">PIXEL CHASE GAME</p>
        <h1 id="game-title">等等贝贝吧</h1>
        <p class="intro">操控董贝贝穿过校园和天桥，别让孟培杰跑远啦！</p>
        <div class="portrait-row" aria-hidden="true">
          <img src="assets/beibei-pixel.png" alt="" />
          <span>VS</span>
          <img src="assets/meng-peijie-pixel.png" alt="" />
        </div>
        <button id="start-button" class="primary-button">开始追赶</button>
        <p class="controls">自动前进　减速/回头：A / ←　冲刺：D / →　跳跃：空格 / W / ↑ / 点屏幕</p>
      </section>

      <section id="game-screen" class="screen game-screen" hidden aria-label="游戏进行中">
        <header class="hud">
          <p id="level-name">第一关 · 校园小路</p>
          <div class="distance-wrap" aria-label="追赶距离">
            <span>距离</span><div class="distance-track"><i id="distance-fill"></i></div>
          </div>
          <div class="distance-wrap" aria-label="贝贝能量">
            <span>能量</span><div class="energy-track"><i id="energy-fill"></i></div>
          </div>
        </header>
        <canvas id="game-canvas" width="1280" height="540" aria-label="董贝贝追赶孟培杰的连续像素追逐游戏"></canvas>
        <p id="game-status" class="sr-only" aria-live="polite"></p>
        <p class="touch-tip">自动前进 · 点击画面跳跃 · 顶惊喜方块 · 碰篮球自动踢向前方</p>
      </section>
    </main>

    <dialog id="lose-dialog" class="result-dialog">
      <div class="dialog-pixels">｡°(°´ᯅ`°)°｡</div>
      <p class="dialog-kicker">追赶失败</p>
      <h2>贝贝跟丢了</h2>
      <p>孟培杰跑得太快啦……</p>
      <div class="dialog-actions">
        <button id="give-up-button" class="ghost-button">放弃</button>
        <button id="retry-button" class="primary-button">再来一遍</button>
        <button class="home-button">返回主页面</button>
      </div>
    </dialog>

    <dialog id="win-dialog" class="result-dialog">
      <div class="dialog-pixels">✦ ˖ ✦</div>
      <p class="dialog-kicker">追赶成功</p>
      <h2 id="win-copy">贝贝追上了</h2>
      <p id="win-detail">没心眼，不等我</p>
      <div class="dialog-actions">
        <button id="next-level-button" class="primary-button">下一关</button>
        <button id="replay-button" class="primary-button" hidden>重来一次</button>
        <button class="home-button">返回主页面</button>
      </div>
    </dialog>

    <script type="module" src="game.js?v=20260918r3"></script>
  </body>
</html>
